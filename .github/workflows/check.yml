name: Python package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build and test tools
        run: python -m pip install build setuptools wheel twine pytest jsonschema
      - name: Check independent installed wheel and sdist
        run: python tools/check_distributions.py --output-dir "${{ runner.temp }}/euaiact-verified-dist"
