name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify package name and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          assert metadata["name"] == "euaiact"
          assert os.environ["RELEASE_TAG"] == "v" + metadata["version"]
          PYCODE
      - name: Prepare build and test tools
        run: python -m pip install build setuptools wheel twine pytest jsonschema
      - name: Build and test the exact distributions offline
        run: python tools/check_distributions.py --output-dir dist
      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/euaiact
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  release-assets:
    name: Attach verified distributions to GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: release-assets
      - name: Download checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: release-assets
      - name: Attach distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
